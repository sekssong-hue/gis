    function drawSpeedometer(speedKts = 0, speedKmh = 0) {
      const canvas = document.getElementById('speedometer');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const width = canvas.width;
      const height = canvas.height;
      const cx = width / 2;
      const cy = height / 2;
      const radius = width * 0.42;

      ctx.clearRect(0, 0, width, height);

      const gradBg = ctx.createRadialGradient(cx, cy, radius * 0.2, cx, cy, radius);
      gradBg.addColorStop(0, '#161b22');
      gradBg.addColorStop(0.85, '#0d1117');
      gradBg.addColorStop(1, '#002b36');

      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);
      ctx.fillStyle = gradBg;
      ctx.fill();
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#00f2fe';
      ctx.shadowColor = 'rgba(0, 242, 254, 0.4)';
      ctx.shadowBlur = 12;
      ctx.stroke();
      ctx.shadowBlur = 0;

      const maxSpeed = 30;
      const startAngle = 135 * (Math.PI / 180);
      const endAngle = 405 * (Math.PI / 180);
      const totalAngle = endAngle - startAngle;

      const majorTicks = 6;
      const minorPerMajor = 5;

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      for (let i = 0; i <= majorTicks; i++) {
        const val = (maxSpeed / majorTicks) * i;
        const angle = startAngle + (i / majorTicks) * totalAngle;

        const innerR = radius - 18;
        const outerR = radius - 6;
        const x1 = cx + Math.cos(angle) * innerR;
        const y1 = cy + Math.sin(angle) * innerR;
        const x2 = cx + Math.cos(angle) * outerR;
        const y2 = cy + Math.sin(angle) * outerR;

        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.lineWidth = 3;
        ctx.strokeStyle = (val >= 20) ? '#ff7b72' : '#00f2fe';
        ctx.stroke();

        const textR = radius - 42;
        const tx = cx + Math.cos(angle) * textR;
        const ty = cy + Math.sin(angle) * textR;
        ctx.font = 'bold 30px sans-serif';
        ctx.fillStyle = (val >= 20) ? '#ff7b72' : '#ffffff';
        ctx.fillText(val.toString(), tx, ty);

        if (i < majorTicks) {
          for (let j = 1; j < minorPerMajor; j++) {
            const mAngle = angle + (j / minorPerMajor) * (totalAngle / majorTicks);
            const mInnerR = radius - 12;
            const mOuterR = radius - 6;
            const mx1 = cx + Math.cos(mAngle) * mInnerR;
            const my1 = cy + Math.sin(mAngle) * mInnerR;
            const mx2 = cx + Math.cos(mAngle) * mOuterR;
            const my2 = cy + Math.sin(mAngle) * mOuterR;

            ctx.beginPath();
            ctx.moveTo(mx1, my1);
            ctx.lineTo(mx2, my2);
            ctx.lineWidth = 1.5;
            ctx.strokeStyle = 'rgba(201, 209, 219, 0.5)';
            ctx.stroke();
          }
        }
      }

      ctx.fillStyle = 'rgba(13, 17, 23, 0.85)';
      ctx.strokeStyle = '#30363d';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(cx - 90, cy + 20, 180, 80, 10);
      } else {
        ctx.rect(cx - 90, cy + 20, 180, 80);
      }
      ctx.fill();
      ctx.stroke();

      ctx.font = 'bold 44px "Consolas", monospace';
      ctx.fillStyle = '#00f2fe';
      ctx.fillText(`${speedKts.toFixed(1)} Kts`, cx, cy + 50);

      ctx.font = 'bold 24px sans-serif';
      ctx.fillStyle = '#c9d1d9';
      ctx.fillText(`(${speedKmh.toFixed(1)} km/h)`, cx, cy + 82);

      ctx.font = 'bold 24px sans-serif';
      ctx.fillStyle = '#79c0ff';
      ctx.fillText('SPEED (KNOTS)', cx, cy - 45);

      const clampedSpeed = Math.min(Math.max(speedKts, 0), maxSpeed);
      const needleAngle = startAngle + (clampedSpeed / maxSpeed) * totalAngle;
      const needleLen = radius - 28;

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(needleAngle);

      ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
      ctx.shadowBlur = 8;
      ctx.shadowOffsetX = 3;
      ctx.shadowOffsetY = 3;

      ctx.beginPath();
      ctx.moveTo(-10, 0);
      ctx.lineTo(0, -4);
      ctx.lineTo(needleLen, 0);
      ctx.lineTo(0, 4);
      ctx.closePath();
      ctx.fillStyle = '#ff3344';
      ctx.fill();
      ctx.restore();

      ctx.beginPath();
      ctx.arc(cx, cy, 10, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#ff3344';
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(cx, cy, 4, 0, Math.PI * 2);
      ctx.fillStyle = '#161b22';
      ctx.fill();
    }

    function playAlertSound(type = 'danger') {
      const alarmToggle = document.getElementById('alarmToggle');
      if (alarmToggle && !alarmToggle.checked) return;

      const now = Date.now();
      if (now - lastAlertTime < ALERT_INTERVAL_MS) return;
      lastAlertTime = now;

      try {
        initAudioContext();
        if (!audioCtx) return;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'danger') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(880, audioCtx.currentTime);
          osc.frequency.setValueAtTime(440, audioCtx.currentTime + 0.15);
          osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.3);

          gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);

          osc.start(audioCtx.currentTime);
          osc.stop(audioCtx.currentTime + 0.5);
        } else {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);

          osc.start(audioCtx.currentTime);
          osc.stop(audioCtx.currentTime + 0.4);
        }
      } catch (e) {
        console.warn("寃쎄퀬???ъ깮 ?ㅽ뙣:", e);
      }
    }

    function getDistanceInKm(lat1, lon1, lat2, lon2) {
      if (!lat1 || !lon1 || !lat2 || !lon2) return 0;
      if (lat1 === lat2 && lon1 === lon2) return 0;
      const R = 6371.0088;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(Math.max(0, 1 - a)));
    }

    function getDistanceInMeters(lat1, lon1, lat2, lon2) {
      return getDistanceInKm(lat1, lon1, lat2, lon2) * 1000;
    }

    function calculateBearing(lat1, lng1, lat2, lng2) {
      const radLat1 = lat1 * Math.PI / 180;
      const radLat2 = lat2 * Math.PI / 180;
      const dLng = (lng2 - lng1) * Math.PI / 180;
      const y = Math.sin(dLng) * Math.cos(radLat2);
      const x = Math.cos(radLat1) * Math.sin(radLat2) - Math.sin(radLat1) * Math.cos(radLat2) * Math.cos(dLng);
      return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    }

    function isPointInPolygon(point, vs) {
      if (!vs || !Array.isArray(vs) || vs.length < 3) return false;
      const x = point[0], y = point[1];
      let inside = false;
      for (let i = 0, j = vs.length - 1; i < vs.length; j = i++) {
        const xi = vs[i][0], yi = vs[i][1];
        const xj = vs[j][0], yj = vs[j][1];
        const intersect = ((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi + 0.0000000001) + xi);
        if (intersect) inside = !inside;
      }
      return inside;
    }

    function handlePositionUpdate(position) {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;
      const currentTime = (position.timestamp && position.timestamp > 1000000000) ? position.timestamp : Date.now();
      let speedMps = position.coords.speed;
      const heading = position.coords.heading;

      if ((speedMps === null || speedMps === undefined || speedMps === 0) && lastLat !== null && lastGpsTime !== null) {
        const distMeters = getDistanceInMeters(lastLat, lastLng, lat, lng);
        const timeDiffSec = (currentTime - lastGpsTime) / 1000;

      lastLat = lat;

      actualGpsLat = lat;

      isGpsActive = true;

      if (!isCalibratedMode) {

      fetchLocationWeather(false);

      let rawKts = 0;
      if (speedMps !== null && speedMps !== undefined && !isNaN(speedMps)) {
        rawKts = speedMps * MPS_TO_KTS;
      }

      currentSpeedKts = (currentSpeedKts * 0.6) + (rawKts * 0.4);
      if (currentSpeedKts < 0.05) currentSpeedKts = 0;
      currentSpeedKmh = currentSpeedKts * 1.852;

      if (typeof heading === 'number' && !isNaN(heading)) {
        currentHeading = heading;

        currentHeading = calculateBearing(lastLat, lastLng, currentLat, currentLng);

      const speedDisplay = document.getElementById('dual-speed-display');

      if (isDrivingStarted) {
        tripSpeedList.push(currentSpeedKts);
        if (currentSpeedKts > tripMaxSpeed) tripMaxSpeed = currentSpeedKts;

        const lastPt = trackPoints[trackPoints.length - 1];
        if (!lastPt || getDistanceInMeters(lastPt[0], lastPt[1], currentLat, currentLng) > 5) {
          if (lastPt) {
            totalTrackDistKm += getDistanceInKm(lastPt[0], lastPt[1], currentLat, currentLng);

          trackPoints.push([currentLat, currentLng]);
          if (trackPolyline) trackPolyline.setLatLngs(trackPoints);

          const distEl = document.getElementById('track-distance');

    function checkGeofenceAndCollisions() {
      const currentPoint = [currentLat, currentLng];
      let inDanger = false;
      let inSafe = false;

      drawnItems.eachLayer(layer => {
        if (layer instanceof L.Polygon || layer instanceof L.Rectangle) {
          const latLngs = layer.getLatLngs()[0];
          const vs = latLngs.map(pt => [pt.lat, pt.lng]);
          if (isPointInPolygon(currentPoint, vs)) {
            if (layer.zoneMeta && layer.zoneMeta.type === 'safe') {
              inSafe = true;
            } else {
              inDanger = true;
            }
          }
        } else if (layer instanceof L.Circle) {
          const center = layer.getLatLng();
          const radius = layer.getRadius();
          if (center.distanceTo(currentPoint) <= radius) {
            if (layer.zoneMeta && layer.zoneMeta.type === 'safe') {
              inSafe = true;
            } else {
              inDanger = true;
            }
          }
        }
      });

      let closeToOther = false;
      Object.keys(otherShipMarkers).forEach(name => {
        const marker = otherShipMarkers[name];
        const mPos = marker.getLatLng();
        const dist = getDistanceInMeters(currentLat, currentLng, mPos.lat, mPos.lng);
        if (dist <= PROXIMITY_WARN_DISTANCE_M) {
          closeToOther = true;
        }
      });

      const guide = document.getElementById('status-guide-text');
      if (inDanger || closeToOther) {
        if (guide && !guide.classList.contains('offline-alert')) {
          guide.className = "guide-text warning-alert";
          guide.innerText = `[?좑툘 寃쎄퀬] ${inDanger ? '?꾪뿕 ?섏뿭 吏꾩엯!' : ''} ${closeToOther ? '?멸렐 ?좊컯 洹쇱젒 寃쎄퀬!' : ''}`;
        }
        playAlertSound('danger');
      } else if (inSafe) {
        if (guide && !guide.classList.contains('offline-alert')) {

          guide.innerText = `[?덉쟾] 吏???좎갑??Safe Zone) ?뺣컯 以?- ?뚮엺 ?먮룞 李⑤떒??;
        }
      } else {
        if (guide && guide.classList.contains('warning-alert')) {
          guide.className = "guide-text";
          guide.innerText = "[?곹깭] 臾쇰튆?섎（?쇳꽣쨌留앹쭊?섎（ ?섏뿭 ?ㅼ떆媛??곕룞 ?꾨즺 - ?덉쟾 ?댄빆?섏꽭??";

    function generateKma7DayForecast(cityKey) {
      const city = KMA_CITIES[cityKey];
      const daysOfWeek = ['??, '??, '??, '??, '紐?, '湲?, '??];
      const today = new Date();
      const forecast = [];

      const conditions = [
        { status: "留묒쓬", icon: "fa-sun", color: "text-amber-400", pop: 10 },
        { status: "援щ쫫議곌툑", icon: "fa-cloud-sun", color: "text-sky-300", pop: 20 },
        { status: "援щ쫫留롮쓬", icon: "fa-cloud", color: "text-slate-300", pop: 30 },
        { status: "?먮┝", icon: "fa-smog", color: "text-slate-400", pop: 40 },
        { status: "鍮?, icon: "fa-cloud-showers-heavy", color: "text-blue-400", pop: 80 },
        { status: "?뚮굹湲?, icon: "fa-cloud-sun-rain", color: "text-indigo-400", pop: 60 }
      ];

      let baseMin = cityKey === 'jinju' ? 12 : (cityKey === 'seoul' ? 10 : 14);
      let baseMax = cityKey === 'jinju' ? 23 : (cityKey === 'seoul' ? 20 : 22);

      for (let i = 0; i < 7; i++) {
        const d = new Date();
        d.setDate(today.getDate() + i);

        const dayName = i === 0 ? "?ㅻ뒛" : (i === 1 ? "?댁씪" : `${daysOfWeek[d.getDay()]}?붿씪`);
        const dateStr = `${d.getMonth() + 1}.${d.getDate()}`;

        const variance = Math.sin(i * 1.5) * 3;
        const minTemp = Math.round(baseMin + variance + (Math.random() * 2 - 1));
        const maxTemp = Math.round(baseMax + variance + (Math.random() * 2 - 1));

        let condIdx = Math.abs(Math.floor(Math.sin(i * 2 + (cityKey.length)) * conditions.length)) % conditions.length;
        let cond = conditions[condIdx];

        forecast.push({
          day: dayName,
          date: dateStr,
          minTemp: minTemp,
          maxTemp: maxTemp,
          status: cond.status,
          icon: cond.icon,
          iconColor: cond.color,
          pop: cond.pop,
          humidity: Math.round(45 + Math.sin(i) * 20),
          wind: (2.0 + (i % 3) * 0.7).toFixed(1)
        });
      }
      return forecast;
    }

                <span class="font-semibold text-indigo-400"><i class="fa-solid fa-droplet text-[8px] mr-0.5"></i>${item.pop}%</span>
              </div>
            </div>
          </div>
        `;
        container.innerHTML += cardHtml;
      });
    }

    function renderKmaCharts(weeklyData) {
      const labels = weeklyData.map(d => `${d.day}(${d.date})`);
      const maxTemps = weeklyData.map(d => d.maxTemp);
      const minTemps = weeklyData.map(d => d.minTemp);
      const pops = weeklyData.map(d => d.pop);

      const ctxTemp = document.getElementById('kmaWeeklyTempChart');
      if (ctxTemp) {
        if (kmaTempChartInstance) kmaTempChartInstance.destroy();
        kmaTempChartInstance = new Chart(ctxTemp.getContext('2d'), {
          type: 'line',
          data: {
            labels: labels,
            datasets: [
              {
                label: '理쒓퀬 湲곗삩 (째C)',
                data: maxTemps,
                borderColor: '#f43f5e',
                backgroundColor: 'rgba(244, 63, 94, 0.1)',
                borderWidth: 2,
                tension: 0.3,
                fill: true
              },
              {
                label: '理쒖? 湲곗삩 (째C)',
                data: minTemps,
                borderColor: '#38bdf8',
                backgroundColor: 'rgba(56, 189, 248, 0.1)',
                borderWidth: 2,
                tension: 0.3,
                fill: true
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { labels: { color: '#94a3b8', font: { size: 10 } } } },
            scales: {
              x: { grid: { color: '#1e293b' }, ticks: { color: '#94a3b8', font: { size: 9 } } },
              y: { grid: { color: '#1e293b' }, ticks: { color: '#94a3b8', font: { size: 9 } } }
            }
          }
        });
      }

      const ctxPop = document.getElementById('kmaWeeklyPopChart');
      if (ctxPop) {
        if (kmaPopChartInstance) kmaPopChartInstance.destroy();
        kmaPopChartInstance = new Chart(ctxPop.getContext('2d'), {
          type: 'bar',
          data: {
            labels: labels,
            datasets: [{
              label: '媛뺤닔 ?뺣쪧 (%)',
              data: pops,
              backgroundColor: 'rgba(99, 102, 241, 0.7)',
              borderRadius: 6
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { labels: { color: '#94a3b8', font: { size: 10 } } } },
            scales: {
              x: { grid: { display: false }, ticks: { color: '#94a3b8', font: { size: 9 } } },
              y: { max: 100, grid: { color: '#1e293b' }, ticks: { color: '#94a3b8', font: { size: 9 } } }
            }
          }
        });
      }
    }

    function updateKmaSummaryStats(weeklyData) {
      const avgTemp = (weeklyData.reduce((acc, cur) => acc + (cur.maxTemp + cur.minTemp)/2, 0) / 7).toFixed(1);
      const maxPop = Math.max(...weeklyData.map(d => d.pop));
      const sunnyCount = weeklyData.filter(d => d.status.includes("留묒쓬") || d.status.includes("援щ쫫議곌툑")).length;
      const rainyCount = weeklyData.filter(d => d.status.includes("鍮?) || d.status.includes("?뚮굹湲?)).length;

      const avgEl = document.getElementById("kma-avg-temp");
      const popEl = document.getElementById("kma-max-pop");
      const sunnyEl = document.getElementById("kma-sunny-days-count");
      const rainyEl = document.getElementById("kma-rainy-days-count");

      if (avgEl) avgEl.innerText = `${avgTemp}째C`;
      if (popEl) popEl.innerText = `${maxPop}%`;
      if (sunnyEl) sunnyEl.innerText = `${sunnyCount}?쇨컙 ?붿갹??;
      if (rainyEl) rainyEl.innerText = `${rainyCount}??鍮??뚮굹湲?;
    }

    function renderKmaHourlyData(todayData) {
      const tempEl = document.getElementById("kma-current-temp");
      const descEl = document.getElementById("kma-current-weather-desc");
      const minEl = document.getElementById("kma-today-min-temp");
      const maxEl = document.getElementById("kma-today-max-temp");
      const humEl = document.getElementById("kma-today-humidity");

      if (tempEl) tempEl.innerText = `${todayData.maxTemp}째`;
      if (descEl) descEl.innerText = `${todayData.status} (泥닿컧 ${(todayData.maxTemp + 0.8).toFixed(1)}째)`;
      if (minEl) minEl.innerText = `${todayData.minTemp}째C`;
      if (maxEl) maxEl.innerText = `${todayData.maxTemp}째C`;
      if (humEl) humEl.innerText = `${todayData.humidity}%`;

      const hourlyContainer = document.getElementById("kma-hourly-forecast-container");
      if (!hourlyContainer) return;
      hourlyContainer.innerHTML = "";

      const currentHour = new Date().getHours();
      for (let i = 0; i < 24; i += 2) {
        const hourTime = (currentHour + i) % 24;
        const timeStr = `${String(hourTime).padStart(2, '0')}:00`;
        const tempOffset = Math.sin((i / 24) * Math.PI * 2) * 4;
        const hourlyTemp = Math.round(todayData.minTemp + (todayData.maxTemp - todayData.minTemp) * 0.7 + tempOffset);

        const itemHtml = `
          <div class="flex-shrink-0 w-16 bg-slate-900/60 border border-slate-800 rounded-xl p-2 text-center flex flex-col justify-between items-center">
            <span class="text-[10px] text-slate-400 font-medium">${timeStr}</span>
            <i class="fa-solid ${todayData.icon} ${todayData.iconColor} text-lg my-2"></i>
            <span class="text-xs font-bold text-white">${hourlyTemp}째</span>
            <span class="text-[9px] text-indigo-400 mt-0.5"><i class="fa-solid fa-droplet text-[7px]"></i> ${todayData.pop}%</span>
          </div>
        `;
        hourlyContainer.innerHTML += itemHtml;
      }
    }
  </script>
